apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-redis
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-redis
  template:
    metadata:
      labels: { app: test-redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
 
---
apiVersion: v1
kind: Service
metadata:
  name: test-redis
spec:
  selector: